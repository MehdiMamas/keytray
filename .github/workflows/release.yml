name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the uploaded Chrome Web Store item for review (default: upload only)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Check tag matches package.json
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check build secrets
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ secrets.WXT_GOOGLE_CLIENT_ID }}
          WXT_GOOGLE_CLIENT_SECRET: ${{ secrets.WXT_GOOGLE_CLIENT_SECRET }}
        run: |
          for name in WXT_GOOGLE_CLIENT_ID WXT_GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wxt prepare
      - run: pnpm compile
      - run: pnpm test

      - name: Build store and sideload zips
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ secrets.WXT_GOOGLE_CLIENT_ID }}
          WXT_GOOGLE_CLIENT_SECRET: ${{ secrets.WXT_GOOGLE_CLIENT_SECRET }}
        run: |
          v="${{ steps.meta.outputs.version }}"
          name="keytray-$v-chrome.zip"
          mkdir -p dist-release
          pnpm zip
          cp ".output/$name" "dist-release/keytray-$v-chrome-store.zip"
          pnpm zip:sideload
          cp ".output/$name" "dist-release/$name"
          ls -l dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist-release/*.zip
          if-no-files-found: error

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          v="${{ steps.meta.outputs.version }}"
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)
          {
            echo "Keytray $v."
            echo
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              git log "$prev..$tag" --no-merges --pretty='- %s' | grep -v -E '^- Release v' || true
            else
              echo "## Changes"
              git log "$tag" --no-merges --pretty='- %s' | grep -v -E '^- Release v' || true
            fi
            echo
            echo "[Chrome Web Store](https://chromewebstore.google.com/detail/keytray/kfkmcgkbicdmgdodjjindmnpofbcmoji)"
            echo
            echo "## Install"
            echo "1. Download \`keytray-$v-chrome.zip\` and unzip it."
            echo "2. Open \`chrome://extensions\` (Edge: \`edge://extensions\`), turn on Developer mode, and Load unpacked the folder that contains \`manifest.json\`."
            echo "3. Follow [SETUP.md](https://github.com/$GITHUB_REPOSITORY/blob/main/SETUP.md)."
          } > release-notes.md
          gh release create "$tag" --draft --title "$tag" --notes-file release-notes.md \
            "dist-release/keytray-$v-chrome.zip" \
            "dist-release/keytray-$v-chrome-store.zip"

  webstore:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
      PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      EXTENSION_ID: kfkmcgkbicdmgdodjjindmnpofbcmoji
    steps:
      - name: Check Chrome Web Store settings
        id: gate
        run: |
          if [ -n "$GCP_WIF_PROVIDER" ] && [ -n "$CWS_SERVICE_ACCOUNT" ] && [ -n "$PUBLISHER_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The variables GCP_WIF_PROVIDER, CWS_SERVICE_ACCOUNT and CWS_PUBLISHER_ID are not all set; skipping Chrome Web Store upload."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: dist-release
      - name: Get a short-lived Google access token
        id: auth
        if: steps.gate.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload to Chrome Web Store
        if: steps.gate.outputs.enabled == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ZIP: dist-release/keytray-${{ needs.build.outputs.version }}-chrome-store.zip
        run: |
          base="https://chromewebstore.googleapis.com"
          item="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          resp=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -T "$ZIP" "$base/upload/v2/$item:upload")
          code=$(echo "$resp" | tail -n1)
          resp=$(echo "$resp" | sed '$d')
          echo "$resp"
          if [ "$code" != "200" ]; then
            echo "::error::Upload failed (HTTP $code)"
            exit 1
          fi
          state=$(echo "$resp" | jq -r '.uploadState // empty')
          tries=0
          while { [ "$state" = "IN_PROGRESS" ] || [ "$state" = "UPLOAD_IN_PROGRESS" ]; } && [ "$tries" -lt 36 ]; do
            sleep 5
            tries=$((tries + 1))
            resp=$(curl -sS -H "Authorization: Bearer $ACCESS_TOKEN" "$base/v2/$item:fetchStatus")
            echo "$resp"
            state=$(echo "$resp" | jq -r '.lastAsyncUploadState // .uploadState // empty')
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store upload did not succeed (state: ${state:-none})"
            exit 1
          fi
      - name: Publish for review
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          resp=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish")
          echo "$resp"
          code=$(echo "$resp" | tail -n1)
          if [ "$code" != "200" ]; then
            echo "::error::Publish failed (HTTP $code)"
            exit 1
          fi
