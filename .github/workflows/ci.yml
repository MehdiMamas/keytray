name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wxt prepare
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm build
        env:
          WXT_GOOGLE_CLIENT_ID: ci-dummy-client-id
          WXT_GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
