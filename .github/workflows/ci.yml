name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wxt prepare
      - run: pnpm compile
      - run: pnpm test
      - run: python3 native/test-host.py
      - run: pnpm build
        env:
          WXT_GOOGLE_CLIENT_ID: ci-dummy-client-id
          WXT_GOOGLE_CLIENT_SECRET: ci-dummy-client-secret

  native-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python native/test-host.py
      - name: Install the helper
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File native/windows/install.ps1
      - name: Registry key exists
        shell: cmd
        run: reg query HKCU\Software\Google\Chrome\NativeMessagingHosts\com.keytray.agent
      - name: Uninstall the helper
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File native/windows/install.ps1 -Uninstall
      - name: Registry key is gone
        shell: cmd
        run: |
          reg query HKCU\Software\Google\Chrome\NativeMessagingHosts\com.keytray.agent >nul 2>&1
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0
