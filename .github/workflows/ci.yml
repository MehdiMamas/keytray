name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx wxt prepare
      - run: npm run compile
      - run: npm test
      - run: npm run build
        env:
          WXT_GOOGLE_CLIENT_ID: ci-dummy-client-id
          WXT_GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
